<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle TR - Kelime Çözücü</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <h2>Wordle TR - Kelime Çözücü</h2>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">Açık Tema</button>
    <button id="dictToggle" class="theme-btn" onclick="toggleDictionary()">Büyük Liste</button>
    
    <div id="suggestions">
        <p>Lütfen başlangıç kelimesini seçiniz:</p>
        <div class="word-options">
            <span class="word-option" onclick="startSession('tarik')">TARİK</span>
            <span class="word-option" onclick="startSession('merak')">MERAK</span>
            <span class="word-option" onclick="startSession('kenar')">KENAR</span>
        </div>
    </div>

    <div id="board"></div>
    <div id="info"></div>

    <script src="data/words.js"></script>
    <script src="src/engine.js"></script>
    <script src="src/app.js"></script>

    <footer class="app-footer">
        <p>Nasıl çalışıyor?</p>
        <a class="footer-link" href="https://github.com/thmsacar/wordle-solver" target="_blank">
            <img src="https://cdn.simpleicons.org/github/a1a1aa" width="28" height="28" alt="GitHub Logo" />
        </a>
    </footer>
</body>
</html>
</body>
</html>
